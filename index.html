<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NREGA Muster Tracker</title>
  
  <!-- APP LOGO / HOME SCREEN FAVICON (SVG HD Logo) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d4ed8'/><path d='M50 18 C32 18 24 32 24 44 L76 44 C76 32 68 18 50 18 Z' fill='%23facc15'/><rect x='18' y='44' width='64' height='9' rx='3' fill='%23ca8a04'/><circle cx='50' cy='66' r='14' fill='%23ffffff'/><path d='M44 66 L48 70 L56 61' stroke='%2316a34a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
  
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231d4ed8'/><path d='M50 18 C32 18 24 32 24 44 L76 44 C76 32 68 18 50 18 Z' fill='%23facc15'/><rect x='18' y='44' width='64' height='9' rx='3' fill='%23ca8a04'/><circle cx='50' cy='66' r='14' fill='%23ffffff'/><path d='M44 66 L48 70 L56 61' stroke='%2316a34a' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

  <!-- Tailwind CSS & Custom Styles -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

  <!-- Top Header -->
  <header class="bg-blue-700 text-white p-4 text-center shadow-md">
    <h1 class="text-xl font-black tracking-wide">NREGA Muster Manager</h1>
    <p class="text-xs text-blue-200">Worker & Muster Attendance Tracker</p>
  </header>

  <!-- Main Container -->
  <div class="max-w-md mx-auto p-3 space-y-4">

    <!-- Navigation Tabs -->
    <div class="flex gap-1 bg-white p-1 rounded-lg shadow-sm">
      <button id="btnTabAttendance" onclick="switchTab('attendance')" class="flex-1 py-2 text-xs font-bold rounded bg-blue-600 text-white">
        Haazri (Daily)
      </button>
      <button id="btnTabSummary" onclick="switchTab('summary')" class="flex-1 py-2 text-xs font-bold rounded bg-gray-200 text-gray-700">
        Muster Hisaab
      </button>
      <button id="btnTabAddWorker" onclick="switchTab('addWorker')" class="py-2 px-3 text-xs font-bold rounded bg-gray-200 text-gray-700">
        + Worker/Muster
      </button>
    </div>

    <!-- Active Muster Selector -->
    <div class="bg-blue-50 border border-blue-200 p-2.5 rounded-lg flex justify-between items-center text-xs">
      <span class="font-bold text-blue-900">Active Muster:</span>
      <select id="musterSelect" onchange="changeMuster(this.value)" class="bg-white border rounded px-2 py-1 font-bold text-gray-700 outline-none">
      </select>
    </div>

    <!-- TAB 1: DAILY ATTENDANCE -->
    <div id="tabAttendance" class="space-y-3">
      <!-- Date Picker -->
      <div class="bg-white p-3 rounded-lg shadow-sm border flex justify-between items-center text-xs">
        <label for="dateInput" class="font-bold text-gray-700">Tareekh Select Karein:</label>
        <input type="date" id="dateInput" onchange="renderAttendance()" class="border rounded p-1 font-bold bg-gray-50">
      </div>

      <!-- Workers Attendance List -->
      <div id="workersAttendanceList" class="space-y-2"></div>

      <!-- Save Button Container -->
      <div id="saveAttendanceBox" class="hidden pt-2">
        <button onclick="saveDailyAttendance()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg font-bold text-sm shadow-md flex items-center justify-center gap-2">
          💾 Save Today's Attendance
        </button>
      </div>
    </div>

    <!-- TAB 2: MUSTER SUMMARY & HISAAB -->
    <div id="tabSummary" class="hidden space-y-3">
      <div id="summaryMusterHeader" class="bg-white p-3 rounded-lg shadow-sm border"></div>
      <div id="workersSummaryList" class="space-y-2"></div>
      <div id="grandTotalBox" class="bg-gray-800 text-white p-3 rounded-lg shadow-md space-y-1"></div>
    </div>

    <!-- TAB 3: ADD WORKER & MUSTER -->
    <div id="tabAddWorker" class="hidden space-y-4">
      <!-- Create Muster -->
      <form onsubmit="handleCreateMuster(event)" class="bg-white p-3 rounded-lg shadow-sm border space-y-2">
        <div class="font-bold text-xs text-blue-900 border-b pb-1">➕ Naya Muster Add Karein</div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="block text-gray-600 font-bold mb-1">Muster No:</label>
            <input type="text" id="newMusterNo" placeholder="e.g. 23" required class="w-full border rounded p-1.5 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-600 font-bold mb-1">Kul Din (Days):</label>
            <input type="number" id="newMusterDays" value="14" required class="w-full border rounded p-1.5 bg-gray-50">
          </div>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-1.5 text-xs font-bold rounded">Create Muster</button>
      </form>

      <!-- Add Worker -->
      <form onsubmit="handleAddWorker(event)" class="bg-white p-3 rounded-lg shadow-sm border space-y-2">
        <div class="font-bold text-xs text-green-900 border-b pb-1">➕ Naya Worker Add Karein</div>
        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-gray-600 font-bold mb-1">Worker Ka Naam:</label>
            <input type="text" id="newWorkerName" placeholder="e.g. Ramesh" required class="w-full border rounded p-1.5 bg-gray-50">
          </div>
          <div>
            <label class="block text-gray-600 font-bold mb-1">Job Card No / ID:</label>
            <input type="text" id="newJobCard" placeholder="e.g. 102" required class="w-full border rounded p-1.5 bg-gray-50">
          </div>
        </div>
        <button type="submit" class="w-full bg-green-600 text-white py-1.5 text-xs font-bold rounded">Add Worker</button>
      </form>
    </div>

  </div>

  <!-- JavaScript File Connection with Cache Busting -->
  <script src="app.js?v=2.0"></script>
</body>
</html>
